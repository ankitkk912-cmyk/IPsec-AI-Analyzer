! IPsec demo configuration
crypto ikev2 proposal SECURE-PROPOSAL
 encryption aes-cbc-256
 integrity sha256
 group 14

crypto ikev2 policy SECURE-POLICY
 proposal SECURE-PROPOSAL

crypto ipsec transform-set SECURE-TS esp-aes 256 esp-sha256-hmac
 mode tunnel

crypto map VPN-MAP 10 ipsec-isakmp
 set peer 203.0.113.10
 set transform-set SECURE-TS
 set pfs group14
 match address 110

access-list 110 permit ip 10.10.10.0 0.0.0.255 10.20.20.0 0.0.0.255
